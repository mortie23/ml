[project]
name = "afl-ladder"
version = "0.1.0"
description = "Create AFL ladder race animations"
readme = "README.md"
authors = [{ name = "christopher", email = "christopher@mortimer.xyz" }]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
afl-ladder = "afl_ladder:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
